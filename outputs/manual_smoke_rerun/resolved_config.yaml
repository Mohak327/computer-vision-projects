runtime:
  seed: 3
  device: cpu
  dtype: float32
  output_root: outputs\manual_smoke_rerun
simulation:
  backend: synthetic
  fallback_backend: synthetic
  image_height: 32
  image_width: 32
  n_cameras: 3
  camera_radius: 2.5
  camera_elevation_deg: 15.0
  frames_per_motion: 10
  motions:
  - walk
  dof: 17
  body_mass: 75.0
  noise_std: 0.0
  use_segmentation: true
  use_depth: true
data:
  root: outputs\manual_smoke_rerun\dataset
  train_split: 0.67
  val_split: 0.0
  test_split: 0.33
  preload_images: false
  clip_length: 4
  ray_batch_size: 64
nerf:
  mode: pose
  pos_freqs: 10
  dir_freqs: 4
  pose_freqs: 4
  hidden_dim: 64
  n_layers: 4
  skip_layer: 2
  n_coarse: 8
  n_fine: 8
  near: 0.5
  far: 4.0
  lr: 0.001
  steps: 2
  eval_every: 1
  chunk_size: 512
  white_background: true
  checkpoint_every: 20
physics:
  enable: true
  weight: 0.05
  depth_weight: 0.5
  silhouette_weight: 0.25
  energy_weight: 1.0
  proxy_gravity_scale: 9.81
world_model:
  hidden_channels: 12
  gated_channels: 4
  kernel_size: 3
  steps: 2
  clip_length: 4
  batch_size: 1
  lr: 0.001
  checkpoint_every: 10
evaluation:
  lpips_net: alex
  batch_size: 1
  occlusion_threshold: 0.25
